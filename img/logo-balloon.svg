<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 122">
  <defs>
    <!-- Forma teardrop / pin exacta con bezier -->
    <clipPath id="c">
      <path d="M50,4 C26,4 5,24 5,50 C5,76 22,92 38,104 L50,120 L62,104 C78,92 95,76 95,50 C95,24 74,4 50,4 Z"/>
    </clipPath>
  </defs>

  <!-- Rojo oscuro: cuadrante superior izquierdo -->
  <rect x="0"  y="0"  width="50" height="57" fill="#800000" clip-path="url(#c)"/>
  <!-- Rojo brillante: cuadrante superior derecho -->
  <rect x="50" y="0"  width="50" height="57" fill="#E00000" clip-path="url(#c)"/>

  <!-- Franja blanca central -->
  <rect x="0"  y="40" width="100" height="18" fill="#EDE9E0" clip-path="url(#c)"/>

  <!-- Azul marino oscuro: cuadrante inferior izquierdo -->
  <rect x="0"  y="58" width="50" height="65" fill="#07093C" clip-path="url(#c)"/>
  <!-- Azul brillante: cuadrante inferior derecho -->
  <rect x="50" y="58" width="50" height="65" fill="#0038B8" clip-path="url(#c)"/>

  <!-- Borde sutil -->
  <path d="M50,4 C26,4 5,24 5,50 C5,76 22,92 38,104 L50,120 L62,104 C78,92 95,76 95,50 C95,24 74,4 50,4 Z"
        fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
</svg>
